<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 38px Manrope,Arial,sans-serif;fill:#102A43}.sub{font:500 17px Manrope,Arial,sans-serif;fill:#52667C}
      .h{font:700 21px Manrope,Arial,sans-serif;fill:#102A43}.t{font:500 15px Manrope,Arial,sans-serif;fill:#243B53}
      .box{fill:#fff;stroke:#CBD5E0;stroke-width:2}.accent{fill:#E0F2FE;stroke:#06B6D4;stroke-width:2}
      .core{fill:#E9FBF7;stroke:#0F766E;stroke-width:2}.warn{fill:#FEF3C7;stroke:#F59E0B;stroke-width:2}
      .arrow{stroke:#718096;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F6F9FB"/>
  <text x="80" y="72" class="title">FXMate — MVP technical architecture</text>
  <text x="80" y="108" class="sub">Decision support and licensed-provider handoff; no custody or FX execution</text>

  <rect x="80" y="175" width="250" height="160" rx="24" class="box" filter="url(#shadow)"/>
  <text x="110" y="218" class="h">Experience</text>
  <text x="110" y="252" class="t">Responsive web / mobile UI</text>
  <text x="110" y="281" class="t">Obligations · plan · scenarios</text>
  <text x="110" y="310" class="t">Alerts · provider handoff</text>

  <rect x="410" y="175" width="250" height="160" rx="24" class="accent" filter="url(#shadow)"/>
  <text x="440" y="218" class="h">Trust gateway</text>
  <text x="440" y="252" class="t">Authentication and consent</text>
  <text x="440" y="281" class="t">API gateway · rate limits</text>
  <text x="440" y="310" class="t">Input and schema validation</text>

  <path d="M330 255 H405" class="arrow"/>

  <rect x="745" y="150" width="775" height="430" rx="28" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="198" class="h">Decision-support services</text>

  <rect x="785" y="230" width="210" height="125" rx="18" class="core"/>
  <text x="810" y="268" class="h">Payment planner</text>
  <text x="810" y="299" class="t">Amount · deadline</text>
  <text x="810" y="325" class="t">Preference</text>

  <rect x="1025" y="230" width="210" height="125" rx="18" class="core"/>
  <text x="1050" y="268" class="h">Scenario engine</text>
  <text x="1050" y="299" class="t">Historical windows</text>
  <text x="1050" y="325" class="t">Cost ranges</text>

  <rect x="1265" y="230" width="210" height="125" rx="18" class="core"/>
  <text x="1290" y="268" class="h">Staging rules</text>
  <text x="1290" y="299" class="t">40 / 30 / 30</text>
  <text x="1290" y="325" class="t">Deadline guardrail</text>

  <rect x="785" y="395" width="210" height="125" rx="18" class="accent"/>
  <text x="810" y="433" class="h">FX data service</text>
  <text x="810" y="464" class="t">RBA ingestion</text>
  <text x="810" y="490" class="t">Freshness validation</text>

  <rect x="1025" y="395" width="210" height="125" rx="18" class="accent"/>
  <text x="1050" y="433" class="h">Alert service</text>
  <text x="1050" y="464" class="t">Rate · tranche</text>
  <text x="1050" y="490" class="t">Payment reminders</text>

  <rect x="1265" y="395" width="210" height="125" rx="18" class="accent"/>
  <text x="1290" y="433" class="h">Provider handoff</text>
  <text x="1290" y="464" class="t">Neutral comparison</text>
  <text x="1290" y="490" class="t">Deep links only</text>

  <path d="M660 255 H740" class="arrow"/>
  <path d="M995 292 H1020" class="arrow"/><path d="M1235 292 H1260" class="arrow"/>
  <path d="M890 390 V360 H1130 V390" class="arrow"/>

  <rect x="80" y="660" width="300" height="150" rx="22" class="accent"/>
  <text x="110" y="702" class="h">Authoritative data</text>
  <text x="110" y="735" class="t">RBA AUD/CNY reference rates</text>
  <text x="110" y="764" class="t">Provider metadata and links</text>
  <text x="110" y="793" class="t">Versioned rule configuration</text>

  <rect x="465" y="660" width="300" height="150" rx="22" class="box"/>
  <text x="495" y="702" class="h">Operational stores</text>
  <text x="495" y="735" class="t">Encrypted user/payment data</text>
  <text x="495" y="764" class="t">De-identified analytics events</text>
  <text x="495" y="793" class="t">Audit and explainability log</text>

  <rect x="850" y="660" width="300" height="150" rx="22" class="warn"/>
  <text x="880" y="702" class="h">Governance controls</text>
  <text x="880" y="735" class="t">APP privacy and retention</text>
  <text x="880" y="764" class="t">Rule/version monitoring</text>
  <text x="880" y="793" class="t">Stale-data and alert checks</text>

  <rect x="1235" y="660" width="285" height="150" rx="22" class="core"/>
  <text x="1265" y="702" class="h">Licensed providers</text>
  <text x="1265" y="735" class="t">Quote and eligibility</text>
  <text x="1265" y="764" class="t">KYC / AML / CTF</text>
  <text x="1265" y="793" class="t">Execution and settlement</text>

  <path d="M230 655 C230 580,830 610,890 525" class="arrow"/>
  <path d="M615 655 C615 590,1010 620,1130 525" class="arrow"/>
  <path d="M1000 655 V585" class="arrow"/>
  <path d="M1377 655 V525" class="arrow"/>
</svg>
